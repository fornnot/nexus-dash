# Render Blueprint — NexusDash static site
# Deploy: Render Dashboard → New → Blueprint → pick this repo, or
# https://dashboard.render.com/select-repo?type=blueprint after pushing to GitHub.
services:
  - type: web
    name: nexus-dash
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      # Fingerprinted build assets never change — cache forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The shell and the service worker must revalidate so PWA updates land.
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
    routes:
      # SPA fallback: any unknown path serves the app shell.
      # (Hash routes like /#/fx never hit the server; this is for future path routing.)
      - type: rewrite
        source: /*
        destination: /index.html
